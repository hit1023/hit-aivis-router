services:
  # 進捗イベント配信用の Zenoh ルーター（pub/sub）。ルーターが client として接続する
  zenoh:
    image: eclipse/zenoh:1.10.2
    restart: unless-stopped
    command: ["--no-multicast-scouting"]
    expose:
      - "7447"

  aivis-router:
    build: .
    environment:
      ZENOH_ENDPOINT: ${ZENOH_ENDPOINT:-tcp/zenoh:7447}
    depends_on:
      - zenoh
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/data
      # 台の追加時に不足モデル(.aivmx)を配る元（エンジンのModelsディレクトリを読み取り専用で）
      - ${MODELS_SOURCE_HOST_DIR:-./data/models-src}:/models:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
